services:
  db:
    image: postgres
    restart: always
    environment:
      - POSTGRES_USER=bot
      - POSTGRES_PASSWORD=bot
      - POSTGRES_DB=PizzaBot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d PizzaBot"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: bot:1.0.0
    env_file:
      - .env
    environment:
      DB_URL: postgresql+asyncpg://bot:bot@db:5432/PizzaBot
    depends_on:
      db:
        condition: service_healthy
